    title-tag="h2"
>
    <p>Les exigences concernant <strong>les</strong> <strong>connaissances en gestion de base ont été supprimées en Wallonie depuis le 1er octobre 2025</strong> et en Région de Bruxelles-Capitale depuis le 15 janvier 2024.</p><p>Il n’est donc plus nécessaire de détenir des compétences de gestion de base pour exercer une activité indépendante en Wallonie ainsi qu’à Bruxelles.</p>
</paragraph-text>

    

<paragraph-separator></paragraph-separator>

    
<anchors-navigation
    id="anchor-nav-777"
    title="Compétences professionnelles"
></anchors-navigation>

    

<paragraph-text
    title="Vos compétences professionnelles "
    title-tag="h2"
>
    <p>L'exigence des compétences professionnelles varie selon vos activités.</p><p>Si vous vous lancez en <strong>Région wallonne ou à Bruxelles</strong>, voici les compétences à prouver :&nbsp;</p><ul><li>Installateur-frigoriste</li><li>Restaurateur ou traiteur-organisateur de banquets</li><li>Boulanger-pâtissier</li><li>Cycles (vente et réparation)</li><li>Véhicules à moteur (vente de véhicules d’occasion et carrosserie)</li><li>Réparation des véhicules à moteur jusque 3.5T</li><li>Réparation des véhicules à moteur &gt; 3.5T</li><li>Gros-œuvre</li><li>Plafonnage, cimentage, chape</li><li>Carrelage, marbre, pierre naturelle</li><li>Toiture, étanchéité</li><li>Menuiserie (placement/réparation) et vitrerie</li><li>Menuiserie générale</li><li>Finition</li><li>Installation (chauffage, climatisation, sanitaire, gaz)</li><li>Electrotechnique</li><li>Entreprise générale</li><li>Coiffeur/coiffeuse</li><li>Esthéticien(ne)</li><li>Opticien</li><li>Entrepreneur de pompes funèbres</li></ul><p>En 2015, suite à la 6<sup>e</sup> réforme de l’État, la matière relative aux accès à la profession a été régionalisée.</p><p>Les informations communiquées sur cette page ne s’appliquent pas aux entreprises dont le siège social est établi sur le territoire de la <strong>Région flamande</strong>.</p>
</paragraph-text>
